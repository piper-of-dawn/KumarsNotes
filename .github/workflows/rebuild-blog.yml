name: Rebuild Blog
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog Pages workflow
        env:
          GH_TOKEN: ${{ secrets.BLOG_REBUILD_TOKEN }}
        run: gh api repos/piper-of-dawn/blog/actions/workflows/pages.yaml/dispatches -f ref=master
